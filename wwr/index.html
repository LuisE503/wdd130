<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;1,300;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css"> 
    <title>Rafting World - Home</title>
</head>
<body>
    <header>
        <img src="images/wwr.jpg" alt="logotype"> 
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <h1>Welcome to Rafting World</h1>  
        </div>
        <section class="newsletter">
            <h2>Join Our Newsletter</h2>
            <form action="subscribe.html" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Subscribe</button>
            </form>
        </section>
        <section class="call-to-action">
            <h2>Adventure Awaits!</h2><br>
            <p><a href="trips.html">Check out our trips and start your adventure today!</a></p>
        </section>
        <section class="about">
            <div class="grid-container">
                <div class="grid-item">
                    <img src="images/r1.jpg" alt="Rafting Adventure 1" class="adventure-img"> 
                    <p>Experience the thrill of white water rafting.</p>
                </div>
                <div class="grid-item">
                    <img src="images/r2.jpg" alt="Rafting Adventure 2" class="adventure-img">
                    <p>Join us for unforgettable adventures.</p>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>©2024 | Rafting World | Luis Escarate</p>
        <nav class="sociallinks">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://x.com">
                <img src="images/x.svg" alt="X">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="YouTube">
            </a>
        </nav>
    </footer>
</body>
</html>
